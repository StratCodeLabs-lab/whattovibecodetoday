<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to vibe code today</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a3de0;--bg-text:#f4f6ff;--card:#ffffff;--card-text:#14183a;--muted:#59608a;--chip:#e6e9ff;--mark:#ffd23f;--mark-text:#14183a;--code:#f0f2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2590;--card:#141733;--card-text:#eef0ff;--muted:#a3a9d6;--chip:#262b5c;--code:#0e1026}}
:root[data-theme="dark"]{--bg:#1b2590;--card:#141733;--card-text:#eef0ff;--muted:#a3a9d6;--chip:#262b5c;--code:#0e1026}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--bg-text);font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.55;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:40px 20px 56px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;letter-spacing:-.02em;margin:0 0 10px}
.sub{margin:0 0 28px;opacity:.85;max-width:46ch}
.card{background:var(--card);color:var(--card-text);border-radius:20px;padding:28px 24px}
.date{color:var(--muted);font-size:.9rem;margin:0 0 6px}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
.blurb{margin:0 0 16px;max-width:56ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.meta span{background:var(--chip);border-radius:999px;padding:3px 12px;font-size:.85rem}
.label{font-weight:600;margin:0 0 6px}
pre{background:var(--code);border-radius:12px;padding:14px 16px;margin:0 0 18px;white-space:pre-wrap;font:inherit;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--mark);color:var(--mark-text)}
button.alt{background:var(--chip);color:var(--card-text)}
button:focus-visible{outline:3px solid var(--card-text);outline-offset:2px}
footer{margin-top:24px;opacity:.8;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>What to vibe code today</h1>
<p class="sub">One small project idea a day, built by describing it to Claude. Pick it up, paste the prompt, ship something by tonight.</p>
<section class="card" aria-live="polite">
<p class="date" id="date"></p>
<h2 id="title"></h2>
<p class="blurb" id="blurb"></p>
<div class="meta" id="meta"></div>
<p class="label">Prompt to paste into Claude</p>
<pre id="prompt"></pre>
<div class="row">
<button id="copy">Copy prompt</button>
<button id="next" class="alt">Show another idea</button>
</div>
</section>
<footer>New idea every day. Come back tomorrow.</footer>
</main>
<script>
const IDEAS=[
["A tiny habit tracker","Track three daily habits with a streak counter that lives in the browser.","1 hour","Beginner","Build a single-page habit tracker for three habits. Show a streak counter for each, a button to check off today, and save everything in localStorage. Clean, minimal design."],
["A flashcard quiz app","Turn any list of terms and answers into a quiz with a score at the end.","1 hour","Beginner","Build a flashcard quiz web app. I paste terms and answers as 'term: answer' lines, it shuffles them, shows one at a time, tracks right and wrong, and shows a final score."],
["A pomodoro timer with themes","A focus timer that changes color each session and plays a soft chime.","1 hour","Beginner","Build a pomodoro timer with 25/5 minute cycles, a big readable countdown, a different background color per session, and a soft chime when time is up."],
["A recipe scaler","Paste a recipe, change the servings, get all the amounts recalculated.","2 hours","Intermediate","Build a recipe scaler. I paste ingredient lines like '2 cups flour', set original and target servings, and it recalculates every amount, handling fractions nicely."],
["A expense splitter for trips","Add friends and expenses, see who owes whom with the fewest payments.","2 hours","Intermediate","Build an expense splitter for group trips. Add people, add expenses with who paid and who shared, then show the minimum set of payments to settle up."],
["A color palette generator","Press space to get a fresh harmonious palette and copy any hex code.","1 hour","Beginner","Build a color palette generator. Space bar creates five harmonious colors, click a color to lock it, click the hex code to copy it."],
["A personal link board","A single page of your favorite links, grouped and searchable.","1 hour","Beginner","Build a personal link board. I can add links with a title and tag, filter by tag, search by text, and everything is saved locally. Make it look like a tidy bookmark wall."],
["A typing speed test","Show a short passage, measure words per minute and accuracy.","2 hours","Intermediate","Build a typing speed test. Show a random short passage, highlight correct and wrong characters live, and show WPM and accuracy at the end with a best score saved locally."],
["A markdown note app","Write on the left, see the rendered preview on the right, notes saved locally.","2 hours","Intermediate","Build a markdown notes app with a notes list, a split editor and live preview, autosave in localStorage, and export of a note as a .md file."],
["A mood journal with a chart","Pick a mood and write one line a day, then see a month chart.","2 hours","Intermediate","Build a mood journal. Each day I choose a mood from 1 to 5 and write one line. Show a calendar heatmap for the month and a simple line chart of the trend."],
["A decision wheel","Spin a wheel to choose lunch, a movie, or what to code next.","1 hour","Beginner","Build a decision wheel. I enter options, it draws a colorful wheel, spins with easing, and lands on one option with a small celebration."],
["A unit converter that explains itself","Convert units and show the formula in plain language.","1 hour","Beginner","Build a unit converter for length, weight, temperature and volume. Besides the result, show the formula used in plain language."],
["A text-adventure game","A short branching story with choices and an inventory.","3 hours","Intermediate","Build a text adventure about a lighthouse keeper. Branching choices, a small inventory, three endings, and a restart button. Write the story yourself."],
["A budget envelope planner","Split monthly income into envelopes and watch them drain.","2 hours","Intermediate","Build an envelope budget planner. Set monthly income, create envelopes with amounts, log spending, and show each envelope as a progress bar."],
["A word of the day page","A new word each day with meaning, example, and a quiz question.","2 hours","Intermediate","Build a word-of-the-day page with 60 built-in words. Pick one by date, show meaning and example, and add a small multiple-choice quiz."],
["A kanban board","Three columns, draggable cards, saved in the browser.","3 hours","Intermediate","Build a kanban board with To do, Doing, and Done columns. Add, edit, delete and drag cards between columns. Save to localStorage."],
["A meeting cost calculator","Enter attendees and salaries, watch the cost tick up live.","1 hour","Beginner","Build a meeting cost calculator. I enter number of attendees and average hourly cost, press start, and a big counter shows the money burning in real time."],
["A pixel art editor","A 16 by 16 grid, a palette, and export to PNG.","3 hours","Intermediate","Build a 16x16 pixel art editor with a color palette, eraser, undo, and a button to download the result as a PNG."],
["A reading list tracker","Books to read, reading, and finished, with ratings and a yearly goal.","2 hours","Intermediate","Build a reading list tracker with three states, star ratings, a yearly goal progress bar, and local saving."],
["A tip and split calculator","The simplest tool done beautifully, with big thumb-friendly controls.","1 hour","Beginner","Build a tip and bill-split calculator designed for phones: huge buttons, quick tip presets, and per-person total shown prominently."],
["A trivia game with Claude","Claude writes the questions on any topic you type in.","3 hours","Advanced","Build a trivia game where I type a topic and Claude generates 5 multiple-choice questions through the Anthropic API in an artifact, then scores me and explains each answer."],
["A personal dashboard","Clock, weather placeholder, to-do list, and a daily quote in one page.","2 hours","Intermediate","Build a personal start page with a big clock, a to-do list saved locally, a daily quote picked by date, and a search box. Keep it calm and spacious."],
["A bingo card generator","Create printable bingo cards for any theme you type in.","2 hours","Intermediate","Build a bingo card generator. I enter 24 or more items, it makes randomized 5x5 cards with a free center, and a print-friendly layout."],
["A countdown to anything","Add events and see days, hours, and minutes left, sorted by nearest.","1 hour","Beginner","Build a countdown page. I add named events with dates, and see live countdowns sorted by nearest, with past events archived."],
["A regex playground","Type a pattern and sample text, see matches highlighted live.","2 hours","Intermediate","Build a regex playground with pattern and flags inputs, a text area, live highlighted matches, and a list of capture groups."]
];
const $=id=>document.getElementById(id);
const today=new Date();
const dayNum=Math.floor((Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
let offset=0;
function render(){
const i=((dayNum+offset)%IDEAS.length+IDEAS.length)%IDEAS.length;
const [t,b,time,lvl,p]=IDEAS[i];
$("date").textContent=offset===0?today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})+"’s idea":"Another idea";
$("title").textContent=t;$("blurb").textContent=b;$("prompt").textContent=p;
$("meta").innerHTML="";
[time,lvl].forEach(x=>{const s=document.createElement("span");s.textContent=x;$("meta").appendChild(s)});
$("copy").textContent="Copy prompt";
}
$("next").onclick=()=>{offset++;render()};
$("copy").onclick=async()=>{
try{await navigator.clipboard.writeText($("prompt").textContent);$("copy").textContent="Copied"}
catch(e){const r=document.createRange();r.selectNodeContents($("prompt"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("copy").textContent="Selected, press copy"}
};
render();
</script>
</body>
</html>
